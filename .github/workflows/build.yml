name: Build

on:
  workflow_dispatch:
  push:
    branches: [dev, main, 'port/**', 'sync/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compiles the library, runs its tests, and builds and verifies the jars.
      - name: Build
        run: ./gradlew build

      # The jars of every successful build. A release tag's run supplies the jars attached to the GitHub
      # release, and a local build of the same commit is compared against them entry for entry.
      - name: Upload the jars
        uses: actions/upload-artifact@v7
        with:
          name: s8tnlib-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
