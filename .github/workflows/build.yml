name: Build

on:
  workflow_dispatch:
  push:
    branches: [dev, main, 'port/**', 'sync/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compiles the library, runs its tests, and builds and verifies the jars.
      - name: Build
        run: ./gradlew build

      # The jars of every successful build. A release tag's run supplies the jars attached to the GitHub
      # release, and a local build of the same commit is compared against them entry for entry.
      - name: Upload the jars
        uses: actions/upload-artifact@v7
        with:
          name: s8tnlib-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  # A v* tag's run creates its GitHub release, as a draft, with the jars the build job made: s8tnlib-<version>.jar
  # (SRG), its sources jar and SHA256SUMS. The notes start as the annotated tag's message. The tag is pushed by hand,
  # and publishing the draft stays the maintainer's step.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # actions/checkout may leave the tag lightweight; --notes-from-tag needs the annotated tag object.
      - name: Fetch the tag
        run: git fetch --force origin "+${GITHUB_REF}:${GITHUB_REF}"

      - name: Download the jars
        uses: actions/download-artifact@v7
        with:
          name: s8tnlib-jars
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          jar="s8tnlib-${version}.jar"
          sources="s8tnlib-${version}-sources.jar"
          ls -l
          test -f "$jar" && test -f "$sources"
          sha256sum "$jar" "$sources" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "S8TNLib ${version}" --notes-from-tag "$jar" "$sources" SHA256SUMS
