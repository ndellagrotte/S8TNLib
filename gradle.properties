# Gradle Properties
org.gradle.jvmargs = -Xmx4G -XX:+UseZGC
org.gradle.workers.max = 2
org.gradle.caching = true
# Unimined is not configuration-cache safe: parallel execution and the configuration cache stay off.
org.gradle.parallel = false
org.gradle.configuration-cache = false

# S8TNLib (docs/PROVENANCE.md). 0.2.0 is the first release after the syncline, demonica@61fa479d,
# which 0.1.0 and 0.1.1 equal: it fixes the PointerBuffer path of bytebuf, drops the Java 8 branches,
# frees a thread's capture buffers after the thread ends, and moves compat/Mods and
# util/font/IFontParameters to Demonica.
s8tnlib_group = com.s8tnlib
s8tnlib_version = 0.2.0
# The jars' manifests name the upstream base and the Demonica commit S8TNLib last synced from, which the kept
# files equal up to 0.1.1.
s8tnlib_base = 9644810c0041584a9c6b80855d64c5766b6d1e1e
s8tnlib_synced_from = 61fa479dcfd00e39b92bdeb84f03c5ec693f6a6f
